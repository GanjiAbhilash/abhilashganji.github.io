<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#f59e0b">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  <!-- Chat bubble (user query) -->
  <g transform="translate(60, 80)" opacity="0.3">
    <rect x="0" y="0" width="130" height="55" rx="12" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="22" cy="28" r="10" fill="none" stroke="#fbbf24" stroke-width="1"/>
    <circle cx="22" cy="24" r="4" fill="none" stroke="#fbbf24" stroke-width="0.8"/>
    <line x1="16" y1="32" x2="28" y2="32" stroke="#fbbf24" stroke-width="0.8"/>
    <rect x="42" y="16" width="70" height="4" rx="2" fill="#fbbf24" opacity="0.5"/>
    <rect x="42" y="26" width="55" height="4" rx="2" fill="#fbbf24" opacity="0.35"/>
    <rect x="42" y="36" width="65" height="4" rx="2" fill="#fbbf24" opacity="0.4"/>
    <!-- Chat tail -->
    <polygon points="20,55 30,55 15,68" fill="none" stroke="#f59e0b" stroke-width="1"/>
  </g>
  <!-- Arrow -->
  <line x1="200" y1="110" x2="245" y2="110" stroke="#f59e0b" stroke-width="1" opacity="0.18" stroke-dasharray="4,3"/>
  <!-- Intent extraction brain -->
  <g transform="translate(255, 70)" opacity="0.25">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="60" y="28" font-family="system-ui" font-size="11" fill="#fbbf24" text-anchor="middle">Intent</text>
    <text x="60" y="44" font-family="system-ui" font-size="11" fill="#fbbf24" text-anchor="middle">Extraction</text>
    <!-- Tags -->
    <rect x="12" y="54" width="40" height="14" rx="7" fill="#f59e0b" opacity="0.2"/>
    <text x="32" y="64" font-family="system-ui" font-size="7" fill="#fbbf24" text-anchor="middle">price</text>
    <rect x="58" y="54" width="50" height="14" rx="7" fill="#f59e0b" opacity="0.2"/>
    <text x="83" y="64" font-family="system-ui" font-size="7" fill="#fbbf24" text-anchor="middle">category</text>
  </g>
  <!-- Arrow -->
  <line x1="385" y1="110" x2="425" y2="110" stroke="#f59e0b" stroke-width="1" opacity="0.18" stroke-dasharray="4,3"/>
  <!-- Embedding retrieval -->
  <g transform="translate(435, 65)" opacity="0.25">
    <rect x="0" y="0" width="120" height="90" rx="10" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="60" y="25" font-family="system-ui" font-size="11" fill="#fbbf24" text-anchor="middle">Embedding</text>
    <text x="60" y="41" font-family="system-ui" font-size="11" fill="#fbbf24" text-anchor="middle">Retrieval</text>
    <!-- Scattered vectors -->
    <circle cx="30" cy="58" r="4" fill="#f59e0b" opacity="0.7"/>
    <circle cx="50" cy="68" r="3" fill="#f59e0b" opacity="0.4"/>
    <circle cx="70" cy="55" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="90" cy="65" r="3" fill="#f59e0b" opacity="0.5"/>
    <circle cx="40" cy="78" r="3" fill="#f59e0b" opacity="0.3"/>
    <circle cx="80" cy="78" r="4" fill="#f59e0b" opacity="0.6"/>
  </g>
  <!-- Arrow -->
  <line x1="565" y1="110" x2="605" y2="110" stroke="#f59e0b" stroke-width="1" opacity="0.18" stroke-dasharray="4,3"/>
  <!-- LLM Re-ranking -->
  <g transform="translate(615, 70)" opacity="0.25">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="60" y="28" font-family="system-ui" font-size="11" fill="#fbbf24" text-anchor="middle">LLM</text>
    <text x="60" y="44" font-family="system-ui" font-size="11" fill="#fbbf24" text-anchor="middle">Re-ranking</text>
    <!-- Ranking bars -->
    <rect x="20" y="54" width="60" height="5" rx="2.5" fill="#f59e0b" opacity="0.8"/>
    <rect x="20" y="63" width="45" height="5" rx="2.5" fill="#f59e0b" opacity="0.5"/>
    <rect x="20" y="72" width="28" height="5" rx="2.5" fill="#f59e0b" opacity="0.3"/>
  </g>
  <!-- Product grid below -->
  <g transform="translate(80, 210)" opacity="0.15">
    <rect x="0" y="0" width="110" height="140" rx="8" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="12" y="12" width="86" height="55" rx="4" fill="#f59e0b" opacity="0.25"/>
    <rect x="12" y="78" width="60" height="5" rx="2.5" fill="#fbbf24"/>
    <rect x="12" y="90" width="40" height="5" rx="2.5" fill="#fbbf24" opacity="0.5"/>
    <rect x="12" y="108" width="45" height="14" rx="7" fill="#f59e0b" opacity="0.35"/>
    <text x="34" y="118" font-family="system-ui" font-size="8" fill="#fbbf24" text-anchor="middle">★ 4.8</text>
  </g>
  <g transform="translate(230, 210)" opacity="0.15">
    <rect x="0" y="0" width="110" height="140" rx="8" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="12" y="12" width="86" height="55" rx="4" fill="#f59e0b" opacity="0.25"/>
    <rect x="12" y="78" width="55" height="5" rx="2.5" fill="#fbbf24"/>
    <rect x="12" y="90" width="35" height="5" rx="2.5" fill="#fbbf24" opacity="0.5"/>
    <rect x="12" y="108" width="45" height="14" rx="7" fill="#f59e0b" opacity="0.35"/>
    <text x="34" y="118" font-family="system-ui" font-size="8" fill="#fbbf24" text-anchor="middle">★ 4.6</text>
  </g>
  <g transform="translate(380, 210)" opacity="0.15">
    <rect x="0" y="0" width="110" height="140" rx="8" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="12" y="12" width="86" height="55" rx="4" fill="#f59e0b" opacity="0.25"/>
    <rect x="12" y="78" width="50" height="5" rx="2.5" fill="#fbbf24"/>
    <rect x="12" y="90" width="42" height="5" rx="2.5" fill="#fbbf24" opacity="0.5"/>
    <rect x="12" y="108" width="45" height="14" rx="7" fill="#f59e0b" opacity="0.35"/>
    <text x="34" y="118" font-family="system-ui" font-size="8" fill="#fbbf24" text-anchor="middle">★ 4.5</text>
  </g>
  <g transform="translate(530, 210)" opacity="0.15">
    <rect x="0" y="0" width="110" height="140" rx="8" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="12" y="12" width="86" height="55" rx="4" fill="#f59e0b" opacity="0.25"/>
    <rect x="12" y="78" width="65" height="5" rx="2.5" fill="#fbbf24"/>
    <rect x="12" y="90" width="30" height="5" rx="2.5" fill="#fbbf24" opacity="0.5"/>
    <rect x="12" y="108" width="45" height="14" rx="7" fill="#f59e0b" opacity="0.35"/>
    <text x="34" y="118" font-family="system-ui" font-size="8" fill="#fbbf24" text-anchor="middle">★ 4.3</text>
  </g>
  <!-- Fan lines from re-ranker to products -->
  <g stroke="#f59e0b" stroke-width="0.7" opacity="0.08">
    <line x1="675" y1="155" x2="135" y2="210"/>
    <line x1="675" y1="155" x2="285" y2="210"/>
    <line x1="675" y1="155" x2="435" y2="210"/>
    <line x1="675" y1="155" x2="585" y2="210"/>
  </g>
  <!-- Floating accents -->
  <circle cx="40" cy="40" r="2" fill="#f59e0b" opacity="0.3"/>
  <circle cx="760" cy="370" r="3" fill="#fbbf24" opacity="0.2"/>
  <circle cx="720" cy="30" r="2" fill="#f59e0b" opacity="0.35"/>
</svg>