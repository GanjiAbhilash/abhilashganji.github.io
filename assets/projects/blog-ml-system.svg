<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#0a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#06b6d4">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  <!-- Data Pipeline -->
  <g transform="translate(40, 60)" opacity="0.25">
    <rect x="0" y="0" width="120" height="70" rx="8" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="60" y="30" font-family="system-ui" font-size="11" fill="#22d3ee" text-anchor="middle">Data</text>
    <text x="60" y="46" font-family="system-ui" font-size="11" fill="#22d3ee" text-anchor="middle">Pipeline</text>
    <!-- Database icon -->
    <ellipse cx="60" cy="58" rx="12" ry="5" fill="none" stroke="#22d3ee" stroke-width="0.8"/>
    <line x1="48" y1="58" x2="48" y2="62" stroke="#22d3ee" stroke-width="0.8"/>
    <line x1="72" y1="58" x2="72" y2="62" stroke="#22d3ee" stroke-width="0.8"/>
  </g>
  <line x1="170" y1="95" x2="210" y2="95" stroke="#06b6d4" stroke-width="1" opacity="0.15" stroke-dasharray="4,3"/>
  <!-- Feature Store -->
  <g transform="translate(215, 50)" opacity="0.25">
    <rect x="0" y="0" width="120" height="90" rx="8" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="60" y="30" font-family="system-ui" font-size="11" fill="#22d3ee" text-anchor="middle">Feature</text>
    <text x="60" y="46" font-family="system-ui" font-size="11" fill="#22d3ee" text-anchor="middle">Store</text>
    <!-- Grid of features -->
    <rect x="20" y="56" width="18" height="10" rx="2" fill="#06b6d4" opacity="0.5"/>
    <rect x="42" y="56" width="18" height="10" rx="2" fill="#06b6d4" opacity="0.7"/>
    <rect x="64" y="56" width="18" height="10" rx="2" fill="#06b6d4" opacity="0.4"/>
    <rect x="20" y="70" width="18" height="10" rx="2" fill="#06b6d4" opacity="0.3"/>
    <rect x="42" y="70" width="18" height="10" rx="2" fill="#06b6d4" opacity="0.6"/>
    <rect x="64" y="70" width="18" height="10" rx="2" fill="#06b6d4" opacity="0.8"/>
  </g>
  <line x1="345" y1="95" x2="385" y2="95" stroke="#06b6d4" stroke-width="1" opacity="0.15" stroke-dasharray="4,3"/>
  <!-- Model Training -->
  <g transform="translate(390, 50)" opacity="0.25">
    <rect x="0" y="0" width="120" height="90" rx="8" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="60" y="30" font-family="system-ui" font-size="11" fill="#22d3ee" text-anchor="middle">Model</text>
    <text x="60" y="46" font-family="system-ui" font-size="11" fill="#22d3ee" text-anchor="middle">Training</text>
    <!-- Neural net icon -->
    <circle cx="35" cy="65" r="4" fill="none" stroke="#22d3ee" stroke-width="0.8"/>
    <circle cx="35" cy="80" r="4" fill="none" stroke="#22d3ee" stroke-width="0.8"/>
    <circle cx="60" cy="72" r="4" fill="none" stroke="#22d3ee" stroke-width="0.8"/>
    <circle cx="85" cy="65" r="4" fill="none" stroke="#22d3ee" stroke-width="0.8"/>
    <circle cx="85" cy="80" r="4" fill="none" stroke="#22d3ee" stroke-width="0.8"/>
    <line x1="39" y1="65" x2="56" y2="72" stroke="#22d3ee" stroke-width="0.5" opacity="0.5"/>
    <line x1="39" y1="80" x2="56" y2="72" stroke="#22d3ee" stroke-width="0.5" opacity="0.5"/>
    <line x1="64" y1="72" x2="81" y2="65" stroke="#22d3ee" stroke-width="0.5" opacity="0.5"/>
    <line x1="64" y1="72" x2="81" y2="80" stroke="#22d3ee" stroke-width="0.5" opacity="0.5"/>
  </g>
  <line x1="520" y1="95" x2="560" y2="95" stroke="#06b6d4" stroke-width="1" opacity="0.15" stroke-dasharray="4,3"/>
  <!-- Model Serving -->
  <g transform="translate(565, 60)" opacity="0.25">
    <rect x="0" y="0" width="120" height="70" rx="8" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="60" y="30" font-family="system-ui" font-size="11" fill="#22d3ee" text-anchor="middle">Model</text>
    <text x="60" y="46" font-family="system-ui" font-size="11" fill="#22d3ee" text-anchor="middle">Serving</text>
    <!-- API icon -->
    <rect x="40" y="52" width="40" height="12" rx="3" fill="#06b6d4" opacity="0.3"/>
    <text x="60" y="62" font-family="monospace" font-size="7" fill="#22d3ee" text-anchor="middle">API</text>
  </g>
  <!-- Monitoring layer below -->
  <g transform="translate(130, 200)" opacity="0.18">
    <rect x="0" y="0" width="540" height="80" rx="10" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="6,4"/>
    <text x="270" y="25" font-family="system-ui" font-size="12" fill="#22d3ee" text-anchor="middle">Monitoring &amp; Observability</text>
    <!-- Metric lines -->
    <polyline points="30,55 60,45 90,50 120,40 150,48 180,42 210,52 240,38 270,46 300,43 330,50 360,35 390,45 420,40 450,48 480,42 510,50" fill="none" stroke="#06b6d4" stroke-width="1.2" opacity="0.5"/>
    <polyline points="30,62 60,58 90,65 120,55 150,60 180,57 210,63 240,52 270,58 300,56 330,62 360,50 390,58 420,55 450,60 480,54 510,60" fill="none" stroke="#22d3ee" stroke-width="0.8" opacity="0.3"/>
  </g>
  <!-- CI/CD pipeline -->
  <g transform="translate(200, 310)" opacity="0.15">
    <rect x="0" y="0" width="400" height="50" rx="8" fill="none" stroke="#06b6d4" stroke-width="1"/>
    <text x="200" y="22" font-family="system-ui" font-size="11" fill="#22d3ee" text-anchor="middle">CI/CD &amp; MLOps Pipeline</text>
    <!-- Pipeline stages -->
    <rect x="30" y="30" width="60" height="12" rx="6" fill="#06b6d4" opacity="0.4"/>
    <rect x="100" y="30" width="60" height="12" rx="6" fill="#06b6d4" opacity="0.3"/>
    <rect x="170" y="30" width="60" height="12" rx="6" fill="#06b6d4" opacity="0.5"/>
    <rect x="240" y="30" width="60" height="12" rx="6" fill="#06b6d4" opacity="0.3"/>
    <rect x="310" y="30" width="60" height="12" rx="6" fill="#06b6d4" opacity="0.4"/>
  </g>
  <!-- Feedback loop arrow -->
  <path d="M690 130 C740 130 740 250 690 250 L180 250 C140 250 140 160 170 140" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.1" stroke-dasharray="6,4"/>
  <!-- Floating elements -->
  <circle cx="50" cy="350" r="3" fill="#06b6d4" opacity="0.3"/>
  <circle cx="750" cy="40" r="2" fill="#22d3ee" opacity="0.4"/>
  <circle cx="730" cy="370" r="4" fill="#06b6d4" opacity="0.2"/>
</svg>