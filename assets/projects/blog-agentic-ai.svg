<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a0a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#10b981">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  <!-- Orchestrator (center) -->
  <g transform="translate(310, 130)" opacity="0.3">
    <rect x="0" y="0" width="180" height="80" rx="12" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="90" y="35" font-family="system-ui" font-size="13" fill="#34d399" text-anchor="middle" font-weight="600">Orchestrator</text>
    <text x="90" y="55" font-family="system-ui" font-size="10" fill="#34d399" text-anchor="middle" opacity="0.7">LangGraph Router</text>
    <!-- State icon -->
    <circle cx="90" cy="68" r="4" fill="#10b981" opacity="0.5"/>
  </g>
  <!-- Agent 1: Researcher (top-left) -->
  <g transform="translate(60, 40)" opacity="0.22">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="28" font-family="system-ui" font-size="11" fill="#34d399" text-anchor="middle">Researcher</text>
    <text x="70" y="44" font-family="system-ui" font-size="9" fill="#34d399" text-anchor="middle" opacity="0.6">Agent</text>
    <!-- Search icon -->
    <circle cx="70" cy="57" r="5" fill="none" stroke="#34d399" stroke-width="0.8"/>
    <line x1="74" y1="61" x2="78" y2="65" stroke="#34d399" stroke-width="0.8"/>
  </g>
  <!-- Agent 2: Coder (top-right) -->
  <g transform="translate(600, 40)" opacity="0.22">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="28" font-family="system-ui" font-size="11" fill="#34d399" text-anchor="middle">Coder</text>
    <text x="70" y="44" font-family="system-ui" font-size="9" fill="#34d399" text-anchor="middle" opacity="0.6">Agent</text>
    <!-- Code brackets icon -->
    <text x="70" y="60" font-family="monospace" font-size="11" fill="#34d399" text-anchor="middle" opacity="0.6">&lt;/&gt;</text>
  </g>
  <!-- Agent 3: Reviewer (bottom-left) -->
  <g transform="translate(60, 280)" opacity="0.22">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="28" font-family="system-ui" font-size="11" fill="#34d399" text-anchor="middle">Reviewer</text>
    <text x="70" y="44" font-family="system-ui" font-size="9" fill="#34d399" text-anchor="middle" opacity="0.6">Agent</text>
    <!-- Checkmark icon -->
    <polyline points="60,57 67,64 80,51" fill="none" stroke="#34d399" stroke-width="1.2"/>
  </g>
  <!-- Agent 4: Tool Agent (bottom-right) -->
  <g transform="translate(600, 280)" opacity="0.22">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="28" font-family="system-ui" font-size="11" fill="#34d399" text-anchor="middle">Tool Use</text>
    <text x="70" y="44" font-family="system-ui" font-size="9" fill="#34d399" text-anchor="middle" opacity="0.6">Agent</text>
    <!-- Wrench icon -->
    <rect x="62" y="52" width="16" height="12" rx="2" fill="none" stroke="#34d399" stroke-width="0.8"/>
    <line x1="70" y1="64" x2="70" y2="68" stroke="#34d399" stroke-width="0.8"/>
  </g>
  <!-- Connection lines from agents to orchestrator -->
  <g stroke="#10b981" stroke-width="1" opacity="0.12">
    <!-- Researcher to Orchestrator -->
    <line x1="200" y1="75" x2="310" y2="145"/>
    <!-- Coder to Orchestrator -->
    <line x1="600" y1="75" x2="490" y2="145"/>
    <!-- Reviewer to Orchestrator -->
    <line x1="200" y1="315" x2="310" y2="210"/>
    <!-- Tool Agent to Orchestrator -->
    <line x1="600" y1="315" x2="490" y2="210"/>
  </g>
  <!-- Inter-agent communication arcs -->
  <g stroke="#10b981" stroke-width="0.8" opacity="0.08" fill="none" stroke-dasharray="4,4">
    <path d="M200 75 C250 20 550 20 600 75"/>
    <path d="M200 315 C250 370 550 370 600 315"/>
    <path d="M60 110 C10 190 10 230 60 280"/>
    <path d="M740 110 C790 190 790 230 740 280"/>
  </g>
  <!-- Memory / State box -->
  <g transform="translate(335, 240)" opacity="0.18">
    <rect x="0" y="0" width="130" height="45" rx="8" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="65" y="20" font-family="system-ui" font-size="10" fill="#34d399" text-anchor="middle">Shared Memory</text>
    <text x="65" y="35" font-family="system-ui" font-size="9" fill="#34d399" text-anchor="middle" opacity="0.5">State Graph</text>
  </g>
  <!-- Human-in-the-loop -->
  <g transform="translate(340, 320)" opacity="0.15">
    <rect x="0" y="0" width="120" height="40" rx="20" fill="none" stroke="#34d399" stroke-width="1"/>
    <text x="60" y="25" font-family="system-ui" font-size="9" fill="#34d399" text-anchor="middle">Human-in-Loop</text>
  </g>
  <line x1="400" y1="285" x2="400" y2="320" stroke="#10b981" stroke-width="0.8" opacity="0.1" stroke-dasharray="3,3"/>
  <!-- Floating elements -->
  <circle cx="30" cy="200" r="2" fill="#10b981" opacity="0.3"/>
  <circle cx="770" cy="200" r="2" fill="#10b981" opacity="0.3"/>
  <circle cx="400" cy="20" r="3" fill="#34d399" opacity="0.2"/>
  <circle cx="400" cy="385" r="3" fill="#34d399" opacity="0.2"/>
</svg>