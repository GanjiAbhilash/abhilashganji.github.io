<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#f59e0b">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  <!-- User query bubble -->
  <g transform="translate(60, 100)" opacity="0.3">
    <rect x="0" y="0" width="140" height="50" rx="25" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="70" y="30" font-family="system-ui" font-size="12" fill="#fbbf24" text-anchor="middle">User Query</text>
    <circle cx="18" cy="25" r="12" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="18" cy="22" r="5" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <line x1="12" y1="30" x2="24" y2="30" stroke="#f59e0b" stroke-width="1"/>
  </g>
  <!-- Arrow 1 -->
  <line x1="210" y1="125" x2="260" y2="125" stroke="#f59e0b" stroke-width="1" opacity="0.2" stroke-dasharray="4,3"/>
  <!-- Intent Extraction -->
  <g transform="translate(265, 80)" opacity="0.25">
    <rect x="0" y="0" width="130" height="90" rx="10" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="65" y="35" font-family="system-ui" font-size="11" fill="#fbbf24" text-anchor="middle">Intent</text>
    <text x="65" y="52" font-family="system-ui" font-size="11" fill="#fbbf24" text-anchor="middle">Extraction</text>
    <!-- Brain icon -->
    <circle cx="65" cy="72" r="8" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <path d="M59 72 C59 66 71 66 71 72" fill="none" stroke="#f59e0b" stroke-width="0.8"/>
  </g>
  <!-- Arrow 2 -->
  <line x1="405" y1="125" x2="450" y2="125" stroke="#f59e0b" stroke-width="1" opacity="0.2" stroke-dasharray="4,3"/>
  <!-- Embedding Retrieval -->
  <g transform="translate(455, 70)" opacity="0.25">
    <rect x="0" y="0" width="130" height="110" rx="10" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="65" y="30" font-family="system-ui" font-size="11" fill="#fbbf24" text-anchor="middle">Embedding</text>
    <text x="65" y="47" font-family="system-ui" font-size="11" fill="#fbbf24" text-anchor="middle">Retrieval</text>
    <!-- Vector dots -->
    <circle cx="35" cy="70" r="4" fill="#f59e0b" opacity="0.6"/>
    <circle cx="55" cy="80" r="3" fill="#f59e0b" opacity="0.4"/>
    <circle cx="75" cy="65" r="5" fill="#f59e0b" opacity="0.7"/>
    <circle cx="95" cy="78" r="3" fill="#f59e0b" opacity="0.5"/>
    <circle cx="50" cy="92" r="4" fill="#f59e0b" opacity="0.3"/>
    <circle cx="80" cy="90" r="3" fill="#f59e0b" opacity="0.6"/>
  </g>
  <!-- Arrow 3 -->
  <line x1="595" y1="125" x2="640" y2="125" stroke="#f59e0b" stroke-width="1" opacity="0.2" stroke-dasharray="4,3"/>
  <!-- LLM Re-ranking -->
  <g transform="translate(645, 80)" opacity="0.25">
    <rect x="0" y="0" width="120" height="90" rx="10" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="60" y="35" font-family="system-ui" font-size="11" fill="#fbbf24" text-anchor="middle">LLM</text>
    <text x="60" y="52" font-family="system-ui" font-size="11" fill="#fbbf24" text-anchor="middle">Re-ranking</text>
    <!-- Ranking bars -->
    <rect x="25" y="62" width="50" height="6" rx="3" fill="#f59e0b" opacity="0.8"/>
    <rect x="25" y="72" width="38" height="6" rx="3" fill="#f59e0b" opacity="0.5"/>
    <rect x="25" y="82" width="22" height="6" rx="3" fill="#f59e0b" opacity="0.3"/>
  </g>
  <!-- Product cards below -->
  <g transform="translate(120, 230)" opacity="0.15">
    <rect x="0" y="0" width="100" height="130" rx="8" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="15" y="15" width="70" height="50" rx="4" fill="#f59e0b" opacity="0.3"/>
    <rect x="15" y="75" width="50" height="6" rx="3" fill="#fbbf24"/>
    <rect x="15" y="88" width="35" height="6" rx="3" fill="#fbbf24" opacity="0.5"/>
    <rect x="15" y="108" width="40" height="10" rx="5" fill="#f59e0b" opacity="0.4"/>
  </g>
  <g transform="translate(260, 230)" opacity="0.15">
    <rect x="0" y="0" width="100" height="130" rx="8" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="15" y="15" width="70" height="50" rx="4" fill="#f59e0b" opacity="0.3"/>
    <rect x="15" y="75" width="55" height="6" rx="3" fill="#fbbf24"/>
    <rect x="15" y="88" width="30" height="6" rx="3" fill="#fbbf24" opacity="0.5"/>
    <rect x="15" y="108" width="40" height="10" rx="5" fill="#f59e0b" opacity="0.4"/>
  </g>
  <g transform="translate(400, 230)" opacity="0.15">
    <rect x="0" y="0" width="100" height="130" rx="8" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="15" y="15" width="70" height="50" rx="4" fill="#f59e0b" opacity="0.3"/>
    <rect x="15" y="75" width="45" height="6" rx="3" fill="#fbbf24"/>
    <rect x="15" y="88" width="40" height="6" rx="3" fill="#fbbf24" opacity="0.5"/>
    <rect x="15" y="108" width="40" height="10" rx="5" fill="#f59e0b" opacity="0.4"/>
  </g>
  <g transform="translate(540, 230)" opacity="0.15">
    <rect x="0" y="0" width="100" height="130" rx="8" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="15" y="15" width="70" height="50" rx="4" fill="#f59e0b" opacity="0.3"/>
    <rect x="15" y="75" width="60" height="6" rx="3" fill="#fbbf24"/>
    <rect x="15" y="88" width="25" height="6" rx="3" fill="#fbbf24" opacity="0.5"/>
    <rect x="15" y="108" width="40" height="10" rx="5" fill="#f59e0b" opacity="0.4"/>
  </g>
  <!-- Connecting lines from re-ranking to products -->
  <g stroke="#f59e0b" stroke-width="0.8" opacity="0.1">
    <line x1="400" y1="185" x2="170" y2="230"/>
    <line x1="400" y1="185" x2="310" y2="230"/>
    <line x1="400" y1="185" x2="450" y2="230"/>
    <line x1="400" y1="185" x2="590" y2="230"/>
  </g>
  <!-- Floating elements -->
  <circle cx="40" cy="50" r="2" fill="#f59e0b" opacity="0.3"/>
  <circle cx="750" cy="350" r="3" fill="#fbbf24" opacity="0.2"/>
  <circle cx="700" cy="30" r="2" fill="#f59e0b" opacity="0.4"/>
</svg>